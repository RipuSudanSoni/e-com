name: Deploy Ripu Sudan Jewellers

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          # अब सीधे e-com फ़ोल्डर को _site के अंदर कॉपी करें
          cp -R e-com _site/

          # रूट URL पर जाने वाले को सीधे ripu-sudan-jewellers पर भेजने के लिए रीडायरेक्ट
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=./e-com/ripu-sudan-jewellers/">
              <script>window.location.href = "./e-com/ripu-sudan-jewellers/";</script>
            </head>
            <body>
              <p>Redirecting to <a href="./e-com/ripu-sudan-jewellers/">Ripu Sudan Jewellers</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
