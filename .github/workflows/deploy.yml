name: Deploy Ripu Sudan Jewellers

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          # 1. नया फ़ोल्डर स्ट्रक्चर तैयार करें
          mkdir -p _site/demo-site/e-com/ripu-sudan-jewellers

          # 2. ripu-sudan-jewellers की सभी फ़ाइलें उस नए पाथ में कॉपी करें
          cp -R ripu-sudan-jewellers/* _site/demo-site/e-com/ripu-sudan-jewellers/

          # 3. रूट URL पर जाने वाले को सीधे इस नए पेज पर भेजने के लिए रीडायरेक्ट बनाएं
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=./demo-site/e-com/ripu-sudan-jewellers/">
              <script>window.location.href = "./demo-site/e-com/ripu-sudan-jewellers/";</script>
            </head>
            <body>
              <p>Redirecting to <a href="./demo-site/e-com/ripu-sudan-jewellers/">Ripu Sudan Jewellers</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
